# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties - universal jar: compiled against the 26.1 baseline, runs on 26.1-26.2
# (fabric.mod.json declares "minecraft": ">=26.1 <26.3"). See https://fabricmc.net/develop
minecraft_version=26.1
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.1.0
maven_group=com.moidclient

# Dependencies
fabric_api_version=0.145.1+26.1

# For fallback testing with JDK 21, you can use:
# minecraft_version=1.21.1
# loader_version=0.16.9
# loom_version=1.7-SNAPSHOT
# fabric_api_version=0.107.0+1.21.1
