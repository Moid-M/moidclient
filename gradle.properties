# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties - shared across all Stonecutter version nodes.
# Per-version minecraft/loader/API versions live in versions/<mc>/gradle.properties.
# See https://fabricmc.net/develop for latest versions
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.2.0
maven_group=com.moidclient
# Acknowledge Stonecutter's Groovy warning (see build output)
dev.kikugie.stonecutter.hard_mode=true

# For fallback testing with JDK 21, you can use:
